services:
  - type: web
    name: carbonvault-api
    runtime: python
    rootDir: Backend
    buildCommand: pip install -r requirements.lock && (git rev-parse HEAD > COMMIT_HASH || true)
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    autoDeploy: true
    healthCheckPath: /ready
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGINS
        value: https://final-carbon-vault.vercel.app,http://localhost:5173,http://127.0.0.1:5173
      - key: DEBUG
        value: "False"
      - key: APP_MODE
        value: demo

  - type: cron
    name: carbonvault-worker
    runtime: python
    rootDir: Backend
    buildCommand: pip install -r requirements.lock
    schedule: "0 */6 * * *"
    startCommand: python worker.py --job all
    plan: free
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: APP_MODE
        value: demo
