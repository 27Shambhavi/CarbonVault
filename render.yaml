services:
  - type: web
    name: carbonvault-api
    runtime: python
    region: virginia
    rootDir: Backend
    buildCommand: pip install -r requirements.lock
    startCommand: alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: carbonvault-postgres
          property: connectionString
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGINS
        value: https://final-carbon-vault.vercel.app,http://localhost:5173,http://127.0.0.1:5173
      - key: DEBUG
        value: "False"
      - key: APP_MODE
        value: demo
      - key: PAYMENT_MODE
        value: test

  - type: cron
    name: carbonvault-worker
    runtime: python
    region: virginia
    rootDir: Backend
    buildCommand: pip install -r requirements.lock
    schedule: "0 */6 * * *"
    startCommand: python worker.py --job all
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: carbonvault-postgres
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: APP_MODE
        value: demo

databases:
  - name: carbonvault-postgres
    databaseName: carbonvault
    user: carbonvault
    plan: free
    region: virginia
