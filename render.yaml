services:
  - type: web
    name: carbonvault-api
    runtime: python
    rootDir: Backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: carbonvault-postgres
          property: connectionString
      - key: RAZORPAY_KEY_ID
        value: rzp_test_SXyS0q18CPS1p1
      - key: RAZORPAY_KEY_SECRET
        value: 9m0Tq4EB8zFLXKJUgzgmCy9I
      - key: CORS_ORIGINS
        value: https://final-carbon-vault.vercel.app,http://localhost:5173,http://127.0.0.1:5173
      - key: DEBUG
        value: "False"

databases:
  - name: carbonvault-postgres
    databaseName: carbonvault
    user: carbonvault_user
    plan: free
