name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  hardcode-and-schema-gate:
    name: Hardcode & Schema Migration Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run JS Hardcode Check
        run: node scripts/check-hardcoded.mjs

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Python Schema Tools
        run: |
          python -m pip install --upgrade pip
          pip install -r Backend/requirements.txt

      - name: Run Python Hardcode Check
        run: python scripts/check_hardcoded.py

      - name: Run Alembic Migrations Parity Gate
        run: python scripts/check_migrations.py

  backend-tests:
    name: Backend Test Suite & Auth Matrix
    runs-on: ubuntu-latest
    needs: hardcode-and-schema-gate
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r Backend/requirements.txt
          pip install pytest httpx pytest-asyncio

      - name: Run Full Test Suite (Contract, Auth Matrix, Foundations, Features)
        working-directory: Backend
        env:
          PYTHONPATH: .
        run: |
          pytest tests -v --tb=short 2>&1 | tee pytest_out.txt || {
            FAILED_LINE=$(grep -E '(FAILED|ERROR)' pytest_out.txt | head -n 5)
            echo "::error::$FAILED_LINE"
            exit 1
          }

  frontend-build:
    name: Frontend Build & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        working-directory: Frontend
        run: npm ci

      - name: Run Frontend Lint
        working-directory: Frontend
        run: npm run lint

      - name: Run Frontend Tests
        working-directory: Frontend
        run: npm test

      - name: Run Frontend Build
        working-directory: Frontend
        run: npm run build

