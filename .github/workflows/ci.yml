name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  hardcode-gate:
    name: Hardcode Eradication Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Run JS Hardcode Check
        run: node scripts/check-hardcoded.mjs

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Run Python Hardcode Check
        run: python scripts/check_hardcoded.py

  backend-tests:
    name: Backend Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r Backend/requirements.txt
          pip install pytest httpx pytest-asyncio

      - name: Run Pytest
        env:
          PYTHONPATH: Backend
        run: |
          pytest Backend/tests -v

  frontend-build:
    name: Frontend Build & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Dependencies
        working-directory: Frontend
        run: npm ci

      - name: Run Frontend Lint & Build & Test
        working-directory: Frontend
        run: |
          npm run lint
          npm test
          npm run build
